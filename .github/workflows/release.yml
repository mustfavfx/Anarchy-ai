name: 'Publish Release'

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 0.7.1)'
        required: true
        type: string

env:
  VITE_SUPABASE_URL: 'https://ejzsbkxpqmhpjuqmszvd.supabase.co'
  VITE_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqenNia3hwcW1ocGp1cW1zenZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MjEzNjIsImV4cCI6MjA5MzE5NzM2Mn0.lbKXt_BLTNXjTKpmqdPLvU6vC-mWNjbVRYjfSGFVZcc'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm install

      - name: Clean Signing Key
        shell: bash
        run: |
          CLEANED_KEY=$(echo -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\r\n[:space:]')
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEANED_KEY" >> $GITHUB_ENV

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: mustfavfx/Anarchy-ai
          tag_name: v${{ steps.get_version.outputs.version }}
          name: 'Anarchy AI v${{ steps.get_version.outputs.version }}'
          draft: false
          prerelease: false
          target_commitish: main
          body: |
            ## What's New
            
            🚀 New features and improvements in this release.
            
            ### Installation
            - Download the installer for your platform
            - Run the installer
            - The app will auto-update in future releases
            
            ### Notes
            - Windows: Download `Anarchy_AI_Setup.exe`

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: mustfavfx
          repo: Anarchy-ai
          tagName: v${{ steps.get_version.outputs.version }}
          releaseId: ${{ steps.create_release.outputs.id }}

# SonarQube / SonarCloud Project Configuration
# More info: https://docs.sonarcloud.io/advanced-setup/automatic-analysis/

sonar.projectKey=mustfavfx_Anarchy-ai
sonar.organization=mustfavfx

# Analyzing only production sources
sonar.sources=src
sonar.tests=src,tests

# Exclude generated directories, build artifacts, rust source, and test files from production sources to guarantee disjoint sets
sonar.exclusions=node_modules/**,dist/**,playwright-report/**,test-results/**,src-tauri/**,.venv/**,*.config.js,setup_dist/**,anarchy_audit/**,src/**/*.test.ts,src/**/*.test.tsx,src/test/**,tests/**

# Test folder definition
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,tests/**/*.ts,tests/**/*.tsx
